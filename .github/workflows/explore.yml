name: Explore API responses

# 임시 워크플로. 실제 응답 필드를 확인하려고 수동으로만 돌린다.
# 수집 스크립트를 확정하고 나면 이 파일과 scripts/explore.mjs를 함께 지운다.
on:
  workflow_dispatch:

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/explore.mjs
        env:
          CHEONGYAK_API_KEY: ${{ secrets.CHEONGYAK_API_KEY }}
          CHEONGYAK_API_ENDPOINT: ${{ secrets.CHEONGYAK_API_ENDPOINT }}
          SUBSIDY_API_KEY: ${{ secrets.SUBSIDY_API_KEY }}
          SUBSIDY_API_ENDPOINT: ${{ secrets.SUBSIDY_API_ENDPOINT }}
