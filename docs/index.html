<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f4e46">
<title>청약 마감 레이더</title>
<meta name="description" content="전국 APT 분양과 임의공급 청약 공고를 매일 모아 접수 마감이 임박한 순서로 보여줍니다. 지역·종류로 걸러 볼 수 있습니다.">
<link rel="canonical" href="https://kyhsa93.github.io/housing-subsidy-radar/">
<meta property="og:type" content="website">
<meta property="og:title" content="청약 마감 레이더">
<meta property="og:description" content="전국 APT 분양과 임의공급 청약 공고를 매일 모아 접수 마감이 임박한 순서로 보여줍니다.">
<meta property="og:url" content="https://kyhsa93.github.io/housing-subsidy-radar/">
<meta property="og:locale" content="ko_KR">
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #666;
    --card: #f5f5f7;
    --border: #e2e2e5;
    --urgent: #c0392b;
    --soon: #b9770e;
    --calm: #1f4e46;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --fg: #eaeaea;
      --muted: #9a9a9a;
      --card: #1a1d24;
      --border: #2a2d35;
      --urgent: #e57373;
      --soon: #e0b060;
      --calm: #7fbfae;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f1115; --fg: #eaeaea; --muted: #9a9a9a;
    --card: #1a1d24; --border: #2a2d35;
    --urgent: #e57373; --soon: #e0b060; --calm: #7fbfae;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #ffffff; --fg: #1a1a1a; --muted: #666;
    --card: #f5f5f7; --border: #e2e2e5;
    --urgent: #c0392b; --soon: #b9770e; --calm: #1f4e46;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.5;
  }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  header {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 12px; margin-bottom: 20px;
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .updated { color: var(--muted); font-size: 0.85rem; }
  .theme-toggle {
    flex-shrink: 0; background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; width: 36px; height: 36px; font-size: 1.1rem;
    line-height: 1; cursor: pointer; color: var(--fg);
  }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
  .controls label { font-size: 0.82rem; color: var(--muted); }
  .controls select, .controls input[type="search"] {
    background: var(--bg); color: var(--fg); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; font-size: 0.85rem; font-family: inherit;
  }
  .controls input[type="search"] { flex: 1; min-width: 140px; }
  .status { font-size: 0.85rem; color: var(--muted); margin-bottom: 12px; }
  .notice {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 10px;
  }
  .notice-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .dday {
    flex-shrink: 0; font-weight: 700; font-size: 0.95rem;
    font-variant-numeric: tabular-nums; color: var(--calm);
  }
  .dday.urgent { color: var(--urgent); }
  .dday.soon { color: var(--soon); }
  .notice-name { font-weight: 600; font-size: 1rem; word-break: keep-all; }
  .tag {
    font-size: 0.68rem; padding: 1px 6px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--muted);
  }
  .tag.open { border-color: currentColor; color: var(--calm); }
  .notice-meta { font-size: 0.82rem; color: var(--muted); margin-top: 6px; word-break: keep-all; }
  .notice-dates { font-size: 0.82rem; margin-top: 8px; display: grid; gap: 2px; }
  .notice-dates div { display: flex; gap: 8px; }
  .notice-dates dt { color: var(--muted); min-width: 5.5em; }
  .notice-actions { margin-top: 10px; display: flex; gap: 12px; flex-wrap: wrap; }
  .notice-actions a { font-size: 0.83rem; color: var(--calm); }
  .empty { color: var(--muted); font-size: 0.9rem; padding: 28px 0; text-align: center; }
  .tabs { display: flex; gap: 6px; margin-bottom: 16px; }
  .tab {
    background: var(--card); border: 1px solid var(--border); border-radius: 999px;
    padding: 6px 14px; font-size: 0.85rem; cursor: pointer; color: var(--fg); font-family: inherit;
  }
  .tab.active { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 600; }
  .panel-note { font-size: 0.82rem; color: var(--muted); margin: 0 0 14px; word-break: keep-all; }
  .subsidy { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
  .subsidy-name { font-weight: 600; font-size: 0.98rem; word-break: keep-all; }
  .subsidy-summary { font-size: 0.85rem; margin-top: 6px; word-break: keep-all; }
  .subsidy-meta { font-size: 0.8rem; color: var(--muted); margin-top: 6px; word-break: keep-all; }
  .subsidy-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .more-btn {
    width: 100%; padding: 12px; margin-top: 4px; font-family: inherit; font-size: 0.9rem;
    color: var(--calm); background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; cursor: pointer;
  }
  footer {
    border-top: 1px solid var(--border); margin-top: 32px; padding-top: 16px;
    color: var(--muted); font-size: 0.78rem;
  }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>청약 마감 레이더</h1>
      <div class="updated" id="updated">불러오는 중...</div>
    </div>
    <button class="theme-toggle" type="button" id="theme-toggle" aria-label="테마 전환"><span aria-hidden="true">🌓</span></button>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab active" type="button" role="tab" aria-selected="true" data-tab="cheongyak">청약 마감</button>
    <button class="tab" type="button" role="tab" aria-selected="false" data-tab="subsidy">주거 지원금</button>
  </div>

  <section id="panel-cheongyak">
    <div class="controls">
      <label for="area-select">지역</label>
      <select id="area-select"><option value="">전체</option></select>
      <label for="kind-select">종류</label>
      <select id="kind-select"><option value="">전체</option></select>
      <input type="search" id="search-input" placeholder="단지·주소 검색">
    </div>

    <p class="status" id="status"></p>
    <div id="list"></div>
  </section>

  <section id="panel-subsidy" hidden>
    <p class="panel-note">
      정부24에 등록된 주거 관련 지원금입니다. 대부분 상시 신청이라 마감일 카운트다운이 없고,
      신청기한은 공고에 적힌 문구를 그대로 보여줍니다.
    </p>
    <div class="controls">
      <label for="region-select">지역</label>
      <select id="region-select"><option value="">전체</option></select>
      <label for="field-select">분야</label>
      <select id="field-select"><option value="">전체</option></select>
      <label for="income-select">소득</label>
      <select id="income-select">
        <option value="">전체</option>
        <option value="0~50%">중위 50% 이하</option>
        <option value="51~75%">중위 51~75%</option>
        <option value="76~100%">중위 76~100%</option>
        <option value="101~200%">중위 101~200%</option>
      </select>
      <label for="age-input">나이</label>
      <input type="number" id="age-input" min="0" max="120" placeholder="예: 34" style="width:5.5em">
    </div>
    <div class="controls">
      <input type="search" id="subsidy-search" placeholder="사업명·기관·내용 검색">
    </div>

    <p class="status" id="subsidy-status"></p>
    <div id="subsidy-list"></div>
    <button class="more-btn" type="button" id="subsidy-more" hidden></button>
  </section>

  <footer>
    <div>자료: 한국부동산원 청약홈 분양정보 (공공데이터포털). 매일 아침 갱신하며, 접수가 끝난 공고는 목록에서 빠집니다.</div>
    <div style="margin-top:6px;">실제 접수 자격과 일정은 반드시 <a href="https://www.applyhome.co.kr" target="_blank" rel="noopener">청약홈</a>의 모집공고문으로 확인하세요.</div>
  </footer>
</main>

<script>
  const THEME_ICONS = { auto: "🌓", light: "☀️", dark: "🌙" };
  let theme = localStorage.getItem("theme") === "light" || localStorage.getItem("theme") === "dark"
    ? localStorage.getItem("theme") : "auto";

  function applyTheme(next) {
    theme = next;
    localStorage.setItem("theme", theme);
    if (theme === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", theme);
    document.querySelector("#theme-toggle span").textContent = THEME_ICONS[theme];
  }
  applyTheme(theme);

  const state = { area: "", kind: "", query: "" };
  let payload = null;

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function kstToday() {
    return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul" }).format(new Date());
  }

  function daysBetween(fromIso, toIso) {
    const from = Date.parse(fromIso + "T00:00:00Z");
    const to = Date.parse(toIso + "T00:00:00Z");
    if (Number.isNaN(from) || Number.isNaN(to)) return null;
    return Math.round((to - from) / 86400000);
  }

  function ddayLabel(days) {
    if (days === null) return "-";
    if (days === 0) return "오늘 마감";
    if (days < 0) return "마감";
    return `D-${days}`;
  }

  function fmtDate(iso) {
    if (!iso) return null;
    const [, m, d] = iso.split("-");
    return `${Number(m)}월 ${Number(d)}일`;
  }

  function fmtRange(start, end) {
    if (!start && !end) return null;
    if (start && end && start !== end) return `${fmtDate(start)} ~ ${fmtDate(end)}`;
    return fmtDate(end ?? start);
  }

  function fmtMoveIn(ym) {
    if (!ym || ym.length !== 6) return null;
    return `${ym.slice(0, 4)}년 ${Number(ym.slice(4))}월`;
  }

  function noticeHtml(notice, today) {
    const days = daysBetween(today, notice.receiptEnd);
    const ddayClass = days !== null && days <= 3 ? "urgent" : days !== null && days <= 7 ? "soon" : "";
    const started = notice.receiptStart ? notice.receiptStart <= today : true;
    const statusTag = started
      ? '<span class="tag open">접수 중</span>'
      : `<span class="tag">${escapeHtml(fmtDate(notice.receiptStart))} 접수 시작</span>`;

    const rows = [
      ["접수", fmtRange(notice.receiptStart, notice.receiptEnd)],
      ["특별공급", fmtRange(notice.specialStart, notice.specialEnd)],
      ["당첨자 발표", fmtDate(notice.winnerDate)],
      ["입주 예정", fmtMoveIn(notice.moveInMonth)],
    ].filter(([, value]) => value);

    const meta = [
      notice.area,
      notice.units ? `${notice.units.toLocaleString("ko-KR")}세대` : null,
      notice.builder,
    ].filter(Boolean).join(" · ");

    const actions = [];
    if (notice.url) actions.push(`<a href="${escapeHtml(notice.url)}" target="_blank" rel="noopener">공고 보기</a>`);
    if (notice.homepage) actions.push(`<a href="${escapeHtml(notice.homepage)}" target="_blank" rel="noopener">분양 홈페이지</a>`);
    if (notice.tel) actions.push(`<a href="tel:${escapeHtml(notice.tel)}">문의 ${escapeHtml(notice.tel)}</a>`);

    return `<article class="notice">
      <div class="notice-head">
        <span class="dday ${ddayClass}">${escapeHtml(ddayLabel(days))}</span>
        <span class="notice-name">${escapeHtml(notice.name)}</span>
        <span class="tag">${escapeHtml(notice.kind ?? "")}</span>
        ${statusTag}
      </div>
      <div class="notice-meta">${escapeHtml(meta)}</div>
      <div class="notice-meta">${escapeHtml(notice.address ?? "")}</div>
      <dl class="notice-dates">
        ${rows.map(([k, v]) => `<div><dt>${escapeHtml(k)}</dt><dd>${escapeHtml(v)}</dd></div>`).join("")}
      </dl>
      <div class="notice-actions">${actions.join("")}</div>
    </article>`;
  }

  function render() {
    const today = kstToday();
    const query = state.query.trim().toLowerCase();
    const notices = (payload?.notices ?? []).filter((notice) => {
      if (state.area && notice.area !== state.area) return false;
      if (state.kind && notice.kind !== state.kind) return false;
      if (!query) return true;
      return `${notice.name ?? ""} ${notice.address ?? ""}`.toLowerCase().includes(query);
    });

    document.getElementById("status").textContent = notices.length
      ? `${notices.length}건 · 마감 임박순`
      : "";
    document.getElementById("list").innerHTML = notices.length
      ? notices.map((notice) => noticeHtml(notice, today)).join("")
      : '<p class="empty">조건에 맞는 공고가 없습니다.</p>';
  }

  function fillSelect(id, values, current) {
    const select = document.getElementById(id);
    select.innerHTML = ['<option value="">전체</option>']
      .concat(values.map((v) => `<option value="${escapeHtml(v)}" ${v === current ? "selected" : ""}>${escapeHtml(v)}</option>`))
      .join("");
  }

  async function main() {
    try {
      const res = await fetch(`./data/cheongyak.json?_=${Date.now()}`);
      if (!res.ok) throw new Error(`http ${res.status}`);
      payload = await res.json();
    } catch (err) {
      console.error("[cheongyak]", err.message);
      document.getElementById("updated").textContent = "-";
      document.getElementById("list").innerHTML = '<p class="empty">공고를 불러오지 못했습니다.</p>';
      return;
    }

    const updated = payload.updatedAt
      ? new Date(payload.updatedAt).toLocaleString("ko-KR", { timeZone: "Asia/Seoul", dateStyle: "medium", timeStyle: "short" }) + " KST"
      : "-";
    document.getElementById("updated").textContent = `갱신: ${updated}`;

    fillSelect("area-select", payload.areas ?? [], state.area);
    fillSelect("kind-select", [...new Set((payload.notices ?? []).map((n) => n.kind).filter(Boolean))].sort((a, b) => a.localeCompare(b, "ko")), state.kind);
    render();
  }

  const SUBSIDY_PAGE = 20;
  const SUBSIDY_REGION_KEY = "subsidyRegion";
  const subsidyState = {
    region: localStorage.getItem(SUBSIDY_REGION_KEY) ?? "",
    field: "", income: "", age: "", query: "", visible: SUBSIDY_PAGE,
  };
  let subsidyPayload = null;
  let subsidyLoaded = false;

  function matchesAge(item, age) {
    const c = item.conditions;
    if (!c || c.ageFrom === null || c.ageTo === null) return true;
    return age >= c.ageFrom && age <= c.ageTo;
  }

  function matchesIncome(item, bracket) {
    const income = item.conditions?.income ?? [];
    return income.length === 0 || income.includes(bracket);
  }

  function subsidyHtml(item) {
    const tags = [];
    if (item.supportType) tags.push(item.supportType);
    if (item.conditions?.ageFrom !== null && item.conditions?.ageTo !== null) {
      tags.push(`${item.conditions.ageFrom}~${item.conditions.ageTo}세`);
    }
    if (item.conditions?.income?.length) tags.push(`중위소득 ${item.conditions.income.join(", ")}`);

    const meta = [item.agency, item.receiver].filter(Boolean).join(" · ");
    return `<article class="subsidy">
      <div class="subsidy-name">${escapeHtml(item.name)}</div>
      ${item.summary ? `<div class="subsidy-summary">${escapeHtml(item.summary)}</div>` : ""}
      ${item.content ? `<div class="subsidy-meta">${escapeHtml(item.content)}</div>` : ""}
      <div class="subsidy-meta">${escapeHtml(meta)}${item.deadline ? ` · 신청기한: ${escapeHtml(item.deadline)}` : ""}</div>
      <div class="subsidy-tags">${tags.map((t) => `<span class="tag">${escapeHtml(t)}</span>`).join("")}</div>
      ${item.url ? `<div class="notice-actions"><a href="${escapeHtml(item.url)}" target="_blank" rel="noopener">자세히 보기</a></div>` : ""}
    </article>`;
  }

  function renderSubsidy() {
    const query = subsidyState.query.trim().toLowerCase();
    const age = subsidyState.age === "" ? null : Number(subsidyState.age);
    const items = (subsidyPayload?.items ?? []).filter((item) => {
      if (subsidyState.region && item.region !== subsidyState.region && item.region !== "전국") return false;
      if (subsidyState.field && item.field !== subsidyState.field) return false;
      if (subsidyState.income && !matchesIncome(item, subsidyState.income)) return false;
      if (age !== null && Number.isFinite(age) && !matchesAge(item, age)) return false;
      if (!query) return true;
      return `${item.name ?? ""} ${item.agency ?? ""} ${item.summary ?? ""} ${item.content ?? ""}`
        .toLowerCase().includes(query);
    });

    const shown = items.slice(0, subsidyState.visible);
    document.getElementById("subsidy-status").textContent = items.length
      ? (items.length > shown.length ? `${items.length}건 중 ${shown.length}건` : `${items.length}건`)
      : "";
    document.getElementById("subsidy-list").innerHTML = shown.length
      ? shown.map(subsidyHtml).join("")
      : '<p class="empty">조건에 맞는 지원금이 없습니다.</p>';

    const more = document.getElementById("subsidy-more");
    const remaining = items.length - shown.length;
    more.hidden = remaining <= 0;
    if (remaining > 0) more.textContent = `${Math.min(remaining, SUBSIDY_PAGE)}건 더 보기`;
  }

  function renderSubsidyFromTop() {
    subsidyState.visible = SUBSIDY_PAGE;
    renderSubsidy();
  }

  async function loadSubsidy() {
    if (subsidyLoaded) return;
    subsidyLoaded = true;
    const status = document.getElementById("subsidy-status");
    status.textContent = "불러오는 중...";
    try {
      const res = await fetch(`./data/subsidy.json?_=${Date.now()}`);
      if (!res.ok) throw new Error(`http ${res.status}`);
      subsidyPayload = await res.json();
    } catch (err) {
      console.error("[subsidy]", err.message);
      status.textContent = "지원금 목록을 불러오지 못했습니다.";
      subsidyLoaded = false;
      return;
    }
    fillSelect("region-select", subsidyPayload.regions ?? [], subsidyState.region);
    fillSelect("field-select", subsidyPayload.fields ?? [], subsidyState.field);
    renderSubsidyFromTop();
  }

  document.querySelectorAll(".tab").forEach((tab) => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach((t) => {
        t.classList.remove("active");
        t.setAttribute("aria-selected", "false");
      });
      tab.classList.add("active");
      tab.setAttribute("aria-selected", "true");
      const isSubsidy = tab.dataset.tab === "subsidy";
      document.getElementById("panel-cheongyak").hidden = isSubsidy;
      document.getElementById("panel-subsidy").hidden = !isSubsidy;
      if (isSubsidy) loadSubsidy();
    });
  });

  document.getElementById("region-select").addEventListener("change", (e) => {
    subsidyState.region = e.target.value;
    localStorage.setItem(SUBSIDY_REGION_KEY, subsidyState.region);
    renderSubsidyFromTop();
  });
  document.getElementById("field-select").addEventListener("change", (e) => { subsidyState.field = e.target.value; renderSubsidyFromTop(); });
  document.getElementById("income-select").addEventListener("change", (e) => { subsidyState.income = e.target.value; renderSubsidyFromTop(); });
  document.getElementById("age-input").addEventListener("input", (e) => { subsidyState.age = e.target.value; renderSubsidyFromTop(); });
  document.getElementById("subsidy-search").addEventListener("input", (e) => { subsidyState.query = e.target.value; renderSubsidyFromTop(); });
  document.getElementById("subsidy-more").addEventListener("click", () => {
    subsidyState.visible += SUBSIDY_PAGE;
    renderSubsidy();
  });

  document.getElementById("area-select").addEventListener("change", (e) => { state.area = e.target.value; render(); });
  document.getElementById("kind-select").addEventListener("change", (e) => { state.kind = e.target.value; render(); });
  document.getElementById("search-input").addEventListener("input", (e) => { state.query = e.target.value; render(); });
  document.getElementById("theme-toggle").addEventListener("click", () => {
    const order = ["auto", "light", "dark"];
    applyTheme(order[(order.indexOf(theme) + 1) % order.length]);
  });

  main();
</script>
</body>
</html>
